<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SimSafari</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23c8963c'/%3E%3C/svg%3E" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; font-family: system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; outline: none; }
  #ui-root { position: fixed; inset: 0; pointer-events: none; }
  #ui-root > * { pointer-events: auto; }
  #boot { position: fixed; left: 12px; bottom: 12px; color: #9aa4ad; font: 12px/1.4 ui-monospace, monospace; pointer-events: none; opacity: .85; white-space: pre; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui-root"></div>
<div id="boot">booting…</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
